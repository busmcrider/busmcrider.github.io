<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Visualizer - Stage 0</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #canvas {
      flex: 1;
      display: block;
      background: #000;
    }

    #controls {
      padding: 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    #fileInput {
      display: none;
    }

    .btn {
      padding: 10px 20px;
      background: #3a3a3a;
      border: 1px solid #555;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #4a4a4a;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      color: #888;
      font-size: 14px;
    }

    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.8;
      border-radius: 4px;
      border: 1px solid #333;
      min-width: 220px;
    }

    .debug-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #333;
    }

    .debug-label {
      color: #888;
    }

    .debug-value {
      color: #4af;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>

    <div id="controls">
      <input type="file" id="fileInput" accept="audio/*">
      <button class="btn" id="loadBtn">Load Audio File</button>
      <button class="btn" id="playBtn" disabled>Play</button>
      <button class="btn" id="pauseBtn" disabled>Pause</button>
      <span id="status">No audio loaded</span>
    </div>
  </div>

  <div id="debug">
    <div><span class="debug-label">FPS:</span> <span class="debug-value" id="fps">0</span></div>
    <div><span class="debug-label">Amplitude:</span> <span class="debug-value" id="amp">0.00</span></div>
    <div><span class="debug-label">Bins:</span> <span class="debug-value" id="bins">0</span></div>

    <div class="debug-section">
      <div><span class="debug-label">Beat Confidence:</span> <span class="debug-value" id="beatConf">0.00</span></div>
      <div><span class="debug-label">BPM:</span> <span class="debug-value" id="bpm">Detecting...</span></div>
    </div>
  </div>

  <!-- Single entry point -->
  <script type="module" src="main.js"></script>
</body>
</html>
