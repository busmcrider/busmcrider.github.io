<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Visualizer - Stage 0</title>
  <link rel="stylesheet" href="test-page/style.css">
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>

    <div id="controls">
      <input type="file" id="fileInput" accept="audio/*">
      <button class="btn" id="loadBtn">Load Audio File</button>
      <button class="btn" id="playBtn" disabled>Play</button>
      <button class="btn" id="pauseBtn" disabled>Pause</button>
      <span id="status">No audio loaded</span>
    </div>
  </div>

  <div id="debug">
    <div><span class="debug-label">FPS:</span> <span class="debug-value" id="fps">0</span></div>
    <div><span class="debug-label">Amplitude:</span> <span class="debug-value" id="amp">0.00</span></div>

    <div class="debug-section">
      <div>
        <span class="debug-label">Beat:</span>
        <span class="beat-indicator" id="beatIndicator"></span>
        <span class="debug-value" id="beatConf">0.00</span>
      </div>
      <div><span class="debug-label">BPM:</span> <span class="debug-value" id="bpm">--</span></div>
      <div><span class="debug-label">Worker:</span> <span class="debug-value" id="workerStatus">Inactive</span></div>
    </div>
  </div>

  <!-- Single entry point -->
  <script type="module" src="main.js"></script>
</body>
</html>
