<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Audio Visualizer</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas" aria-label="Audio visualizer canvas"></canvas>

  <section class="controls" aria-label="Visualizer controls">
    <div class="control-top">
      <div class="album-picker">
        <label for="albumSelect">Album</label>
        <select id="albumSelect" aria-label="Select album"></select>
      </div>
      <button id="startBtn" type="button">Start Visualizer</button>
    </div>

    <div class="control-row track-controls">
      <button id="prevBtn" type="button" aria-label="Previous track">◀</button>
      <div class="track-title" aria-live="polite">
        <span id="trackTitle"></span>
      </div>
      <button id="nextBtn" type="button" aria-label="Next track">▶</button>
    </div>

    <div class="playlist-wrapper" aria-label="Album playlist">
      <button class="playlist-header" id="playlist-toggle" type="button">
        <span id="playlist-title">Tracklist</span>
        <span id="playlist-chevron">▾</span>
      </button>
      <ul id="trackList"></ul>
    </div>

    <div class="control-row action-buttons">
      <button id="symmetryBtn" type="button">Symmetry: None</button>
      <button id="colorBtn" type="button">Color: Monochrome</button>
      <button id="nodeCountBtn" type="button">Nodes: 16</button>
      <button id="arrangementBtn" type="button">Layout: Circle</button>
    </div>

    <label class="slider-control" for="correlationSlider">
      Correlation threshold: <span id="correlationValue">0.66</span>
      <input type="range" id="correlationSlider" min="0" max="1" step="0.01" value="0.66">
    </label>

    <div class="info" aria-live="polite">
      <span id="status">Click Start to begin</span>
    </div>
  </section>

  <audio id="audio" preload="auto"></audio>

  <script src="../shared/music.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
