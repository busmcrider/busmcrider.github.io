<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Visualizer - Test Page</title>
  <link rel="stylesheet" href="ui/test-page.css">
</head>
<body>
  <div id="app">
    <div id="controls">
      <div class="control-group">
        <input type="file" id="fileInput" accept="audio/*">
        <button id="loadBtn">Load Audio File</button>
        <span id="fileName"></span>
      </div>

      <div class="separator"></div>

      <div class="control-group">
        <button id="playBtn" disabled>Play</button>
        <button id="pauseBtn" disabled>Pause</button>
      </div>
    </div>

    <div id="mainContent">
      <div id="configPanel">
        <!-- Preset Management Section -->
        <div id="presetSection">
          <h3>Preset Management</h3>
          <div class="preset-controls">
            <div class="preset-row">
              <input type="text" id="presetNameInput" placeholder="Preset name...">
              <button id="savePresetBtn">Save</button>
            </div>
            <div class="preset-row">
              <button id="exportConfigBtn" style="flex: 1;">Export JSON</button>
              <button id="importConfigBtn" style="flex: 1;">Import JSON</button>
            </div>
          </div>
          <div id="presetList"></div>
        </div>

        <!-- Config Controls Container -->
        <div id="configControls"></div>
      </div>

      <div id="canvasContainer">
        <canvas id="visualizerCanvas"></canvas>
      </div>
    </div>

    <div id="debugOverlay">
        <div class="debug-item">
          <div class="label">FPS</div>
          <div class="value" id="fpsValue">0</div>
        </div>
        <div class="debug-item">
          <div class="label">BPM</div>
          <div class="value" id="bpmValue">--</div>
        </div>
        <div class="debug-item" id="beatIndicator">
          <div class="beat-flash">●</div>
        </div>
        <div class="debug-item">
          <div class="label">Pitch</div>
          <div class="value small" id="pitchValue">--</div>
        </div>
        <div class="debug-item">
          <div class="label">Key</div>
          <div class="value small" id="keyValue">--</div>
        </div>
        <div class="debug-item">
          <div class="label">Voice</div>
          <div class="value small" id="voiceValue">--</div>
        </div>
      </div>
    </div>

  <script type="module" src="main.js"></script>
</body>
</html>
